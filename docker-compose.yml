version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: financeintel_postgres
    restart: always
    environment:
      POSTGRES_USER: finance_admin
      POSTGRES_PASSWORD: secure_finance_password_2026
      POSTGRES_DB: financeintel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_admin -d financeintel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeintel_api
    restart: always
    environment:
      DATABASE_URL: postgresql://finance_admin:secure_finance_password_2026@postgres:5432/financeintel_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock_key_for_local_demo}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financeintel_ui
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  airflow-init:
    image: apache/airflow:2.8.1-python3.11
    container_name: financeintel_airflow_init
    entrypoint: [/bin/bash, -c]
    command:
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --firstname Finance \
          --lastname Admin \
          --role Admin \
          --email admin@financeintel.internal \
          --password admin
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags

  airflow-standalone:
    image: apache/airflow:2.8.1-python3.11
    container_name: financeintel_airflow
    restart: always
    command: standalone
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - BACKEND_API_URL=http://backend:8000
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      - backend
      - airflow-init

volumes:
  postgres_data:
